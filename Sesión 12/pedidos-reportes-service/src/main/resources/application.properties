spring.application.name=pedidos-reportes-service

server.port=8083
server.servlet.context-path=/pedidos-reportes-service

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/InventarioDB?serverTimezone=America/Lima}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin123*}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

logging.level.root=INFO
logging.level.org.springframework.jdbc.core=INFO